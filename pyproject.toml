[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailcrm-mg-connector"
dynamic = ["version"]
description = "Коннектор к чатам RetailCRM через MessageGateway Bot API: выпуск токена и выгрузка переписок"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "saniq7" }, { name = "capelancrm" }]
keywords = ["retailcrm", "messagegateway", "mg", "chats", "connector", "crm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Chat",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/saniq7/RetailCRM-MG-Connector"
Issues = "https://github.com/saniq7/RetailCRM-MG-Connector/issues"

[project.scripts]
retailcrm-mg = "retailcrm_mg.cli:main"

[tool.setuptools.dynamic]
version = { attr = "retailcrm_mg.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retailcrm_mg = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
